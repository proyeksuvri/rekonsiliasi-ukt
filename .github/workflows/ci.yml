name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEON_AUTH_BASE_URL: https://example.neon.tech/auth
          NEON_AUTH_COOKIE_SECRET: ci-placeholder-secret-at-least-32-characters-long
          DATABASE_URL: postgres://user:pass@localhost:5432/rekonsiliasi_ukt
          NEXT_PUBLIC_APP_URL: http://localhost:3000
